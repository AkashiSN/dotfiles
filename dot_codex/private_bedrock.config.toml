# Bedrock 用オーバレイ。codex-bedrock が ~/.codex/config.toml にこれを被せたものを一時 home の
# config.toml として書き出す(手で `codex --profile bedrock` として使うこともできる)。プレーン
# codex はサブスク(OpenAI ログイン)のまま無変更で、Bedrock を使うときだけこれを被せる。
# 認証に使う AWS プロファイルはここに書かず、codex-bedrock が環境変数
# CODEX_BEDROCK_AWS_PROFILE(既定 cdx-pre-dev)から AWS_PROFILE を渡す。そのプロファイルの
# credential_process = aws-login が認証を担うため、シェル側の追加ログインは不要。codex が
# 実行時状態を書き戻すのは一時 home 側の config.toml なので、このファイルは読み取り専用として
# chezmoi で常時同期する。
model = "openai.gpt-5.6-sol"
model_provider = "amazon-bedrock"

# openai.gpt-5.6-sol を提供しているのは us-east-1 / us-east-2 のみ。他リージョンの
# bedrock-mantle エンドポイントは 404 "The model ... does not exist" を返す。
[model_providers.amazon-bedrock.aws]
region = "us-east-1"
wire_api = "responses"
