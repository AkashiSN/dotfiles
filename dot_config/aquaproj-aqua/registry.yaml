# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
# Local registry for tools not in the aqua standard registry.
packages:
  - type: github_release
    repo_owner: yt-dlp
    repo_name: yt-dlp
    description: A feature-rich command-line audio/video downloader
    format: raw
    asset: yt-dlp_{{.OS}}
    replacements:
      darwin: macos
    overrides:
      - goos: linux
        goarch: amd64
        asset: yt-dlp_linux
      - goos: linux
        goarch: arm64
        asset: yt-dlp_linux_aarch64
      - goos: windows
        asset: yt-dlp.exe
    supported_envs:
      - darwin
      - linux
      - windows/amd64

  - type: github_release
    repo_owner: wez
    repo_name: atomicparsley
    description: A lightweight command line program for reading, parsing and setting iTunes-style MPEG-4 metadata
    asset: AtomicParsley{{.OS}}.{{.Format}}
    format: zip
    replacements:
      darwin: MacOS
      linux: Linux
      windows: Windows
    files:
      - name: AtomicParsley
    supported_envs:
      - darwin
      - linux/amd64
      - windows/amd64

  - type: github_release
    repo_owner: simulot
    repo_name: immich-go
    description: Command line to help move your photos from Google Photos takeout to your immich server
    asset: immich-go_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    replacements:
      darwin: Darwin
      linux: Linux
      windows: Windows
      amd64: x86_64
    overrides:
      - goos: windows
        format: zip
    supported_envs:
      - darwin
      - linux
      - windows

  # Kiro CLI。3.x の配布物は kirocli/bin/kiro-cli だけを含む（標準レジストリの定義は kiro-cli-chat も
  # 要求するため入らない）。配布は Linux（musl 静的ビルド）のみ。macOS は公式インストーラの .app を使う。
  - type: http
    name: kiro.dev/kiro-cli
    description: Kiro CLI is an agentic coding tool that lives in your terminal
    link: https://kiro.dev/docs/cli/installation/
    url: https://prod.download.cli.kiro.dev/stable/{{.Version}}/kirocli-{{.Arch}}-linux-musl.zip
    format: zip
    files:
      - name: kiro-cli
        src: kirocli/bin/kiro-cli
    replacements:
      amd64: x86_64
      arm64: aarch64
    supported_envs:
      - linux
